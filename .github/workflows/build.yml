name: Build TWRP for gold

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python3-pip \
            ccache cpio lz4 xz-utils zstd

      - name: Configure git
        run: |
          git config --global user.name "gh-actions"
          git config --global user.email "gh-actions@github.com"
          git config --global http.postBuffer 524288000

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init TWRP manifest
        run: |
          mkdir -p $GITHUB_WORKSPACE/twrp
          cd $GITHUB_WORKSPACE/twrp
          repo init --depth=1 --no-clone-bundle \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      - name: Sync TWRP source
        run: |
          cd $GITHUB_WORKSPACE/twrp
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --no-manifest-update

      - name: Copy device tree
        run: |
          mkdir -p $GITHUB_WORKSPACE/twrp/device/xiaomi/gold
          cp -r $GITHUB_WORKSPACE/device_tree/. \
                $GITHUB_WORKSPACE/twrp/device/xiaomi/gold/

      - name: Build vendorbootimage
        run: |
          cd $GITHUB_WORKSPACE/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_gold-ap2a-eng
          mka vendorbootimage -j4

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-images
          path: |
            ${{ github.workspace }}/twrp/out/target/product/gold/vendor_boot.img
            ${{ github.workspace }}/twrp/out/target/product/gold/*.img
            ${{ github.workspace }}/twrp/out/target/product/gold/recovery/root/
          if-no-files-found: warn
